<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css?family=Josefin+Sans:300,400,400i|Nunito:300,300i"
      rel="stylesheet"
    />

    <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
      <symbol id="icon-go-back" viewBox="0 0 128 128">
        <path
          d="M78.1 0v6.2c22.4 0 40.5 18.2 40.5 40.6s-18.1 40.6-40.5 40.6H17.9l27.9-28-4.5-4.5L5.5 90.8l36 36.2 4.5-4.5-28.8-28.9h60.9c25.8 0 46.7-21 46.7-46.8S103.9 0 78.1 0z"
        />
      </symbol>
    </svg>

    <link rel="stylesheet" href="sass/main.scss" />
    <link rel="shortcut icon" type="image/png" href="img/parcel.png" />

    <title>Parcel Locker Service</title>
  </head>

  <body>
    <div class="container">
      <!-- ========================= -->
      <!-- HEADER                    -->
      <!-- ========================= -->
      <div class="buttons-bar">


        <button class="buttons-bar__button buttons-bar__button-account" id="account-button">Moje konto</button>

        <div class="buttons-bar__dev-buttons" data-roles="ADMIN,OPERATOR">
          <button class="buttons-bar__button" id="check-db-button">Sprawdz połączenie z bazą</button>
          <button class="buttons-bar__button" id="init-db-button">Wczytaj baze danych</button>
        </div>

        <button class="buttons-bar__button buttons-bar__button-change-password" id="change-password-button">Zmień hasło</button>
        <button class="buttons-bar__button buttons-bar__button-logout" id="logout-button">Wyloguj się</button>
    
      </div>

      <!-- ========================= -->
      <!-- SIDEBAR                   -->
      <!-- ========================= -->
      <section class="sidebar">
        <nav class="sidebar__nav">
          <button class="sidebar__button hidden" id="get-automaty">Lista automatów</button>

          <button class="sidebar__button hidden" id="nav-my-packages" data-roles="KLIENT">
            Moje paczki
          </button>

          <button class="sidebar__button hidden" id="nav-create-package" data-roles="KLIENT">
            Nadaj paczkę
          </button>

          <button class="sidebar__button hidden" id="nav-courier-packages" data-roles="KURIER">
            Paczki do obsługi
          </button>

          <button class="sidebar__button hidden" id="nav-operator-panel" data-roles="ADMIN,OPERATOR">
            Panel operatora
          </button>

          <button class="sidebar__button hidden" id="nav-users" data-roles="ADMIN">
            Zarządzanie użytkownikami
          </button>

          <button class="sidebar__button hidden" id="nav-dev-tools" data-roles="ADMIN" data-dev="true">
            Narzędzia dev
          </button>
        </nav>
      </section>



      <!-- ========================= -->
      <!-- GO BACK + MESSAGES        -->
      <!-- ========================= -->
     

      <section class="message">
        <p class="db-message" id="db-message"></p>
      </section>

      <!-- ========================= -->
      <!-- MAIN                      -->
      <!-- ========================= -->
      <main class="main">
        <!-- ===================================================== -->
        <!-- WIDOK 1: LISTA AUTOMATÓW I WYBÓR AUTOMATU  -->
        <!-- ===================================================== -->
        <section class="view hidden" id="view-automaty" data-view data-roles="ADMIN,KURIER,OPERATOR">
           <button class="go-back-button hidden" id="go-back-button">Wróć do listy automatów</button>
          <section class="buttons-cities" id="buttons-cities"></section>

          <section class="list-lockers-in-city" id="list-lockers-in-city"></section>

          <section class="locker-display hidden" id="locker-display">
            <h2 class="locker-display__locker-name" id="locker-name"></h2>

            <div class="locker-display__grid"></div>
            <div class="locker-display__info" id="locker-info">
              <p class="locker-display__info-title">Legenda</p>
              <div class="locker-display__info__legend-box">

                <div class="locker-display__info__legend-box--free">
                  <div class="legend-box__color legend-box__color--free"></div>
                  <span class="legend-box__label">Wolna</span>
                </div>
                
                <div class="locker-display__info__legend-box--occupied">
                  <div class="legend-box__color legend-box__color--occupied"></div>
                  <span class="legend-box__label">Zajęta</span>
                </div>

                <div class="locker-display__info__legend-box--out-of-order">
                  <div class="legend-box__color legend-box__color--out-of-order"></div>
                  <span class="legend-box__label">Uszkodzona</span>
                </div>

              </div>

            </div>
          </section>
        </section>

        <!-- ========================= -->
        <!-- WIDOK 2: KLIENT           -->
        <!-- ========================= -->
        <section class="view view-klient hidden" id="view-klient" data-view data-roles="KLIENT">
      
          <section class="view-klient__lista-paczek">
            <div class="view-klient__lista-paczek__sent-received" id="sent-received-buttons">
              <button class="view-klient__lista-paczek__sent-received-button view-klient__lista-paczek__buttons-button" id="btn-sent-to-me">
                Do mnie
              </button>
              <button class="view-klient__lista-paczek__sent-received-button view-klient__lista-paczek__buttons-button" id="btn-sent-by-me">
                Nadane przeze mnie
              </button>

            </div>
            <p class="view-klient__lista-paczek-message" id="lista-paczek-message"></p>
            <div class="view-klient__lista-paczek__buttons" id="lista-paczek-buttons">
             
            </div>


          </section>
            <section class="view-klient__paczka-details" id="paczka-details">
              <div class="view-klient__paczka-details__box hidden" id="paczka-details-box">
                <div class="view-klient__paczka-details__box-general-info view-klient__paczka-details__box-section" id="general-info">
                    <p class="view-klient__paczka-details__box-general-info--sender">
                      <span class="span-sender-label span-label" id="sender-label"></span>
                      <span class="span-sender-value span-value" id="sender-value"></span>
                    </p>

                    <p class="view-klient__paczka-details__box-general-info--parcel-number">
                      <span class="span-parcel-number-label span-label" id="parcel-number-label"></span>
                      <span class="span-parcel-number-value span-value" id="parcel-number-value"></span>
                    </p>

                    <p class="view-klient__paczka-details__box-general-info--status" id="status-row">
                      <span class="span-status-label span-label" id="status-label"></span>
                      <span class="span-status-value span-value" id="status-value"></span>
                    </p>

                    <p class="view-klient__paczka-details__box-general-info--deadline hidden" id="deadline-row">
                      <span class="span-deadline-label span-label" id="deadline-label"></span>
                      <span class="span-deadline-value span-value" id="deadline-value"></span>
                    </p>

                    <button id="przedluz-btn" class="view-klient__paczka-details__box-section__extend-button" type="button">
                      Przedłuż
                    </button>

                </div>

                <div class="view-klient__paczka-details__box-locker-info view-klient__paczka-details__box-section" id="locker-info">
                  <p class="view-klient__paczka-details__box-locker-info--name">
                    <span class="span-locker-name-label span-label" id="locker-name-label"></span>
                    <span class="span-locker-name-value span-value" id="locker-name-value"></span>
                  </p>
                  <p class="view-klient__paczka-details__box-locker-info--location">
                    <span class="span-locker-location-label span-label" id="locker-location-label"></span>
                    <span class="span-locker-location-value span-value" id="locker-location-value"></span>
                  </p>
                </div>

                <div class="view-klient__paczka-details__box-events view-klient__paczka-details__box-section" id="paczka-events">
            
                </div>
              </div>
          </section>
        </section>

        <!-- ==========================-->
        <!-- WIDOK 3: NADAJ PACZKĘ     -->
        <!-- ==========================-->
        <section class="view-create-package hidden" id="view-create-package" data-view data-roles="KLIENT">
          <form class="view-create-package__form" id="create-package-form">
            <div class="form-group--1 form-group">
              <label for="recipient-email" class="label-create-package">Email odbiorcy:</label>
              <input type="email" id="recipient-email" name="recipient-email" required />
            </div>

            <div class="form-group--2 form-group">
              <div class="select-row">
                <label for="city-select" class="label-create-package">Wybierz miasto:</label>
                <select id="city-select" name="city-select" required>
                  <option value="" disabled selected>Wybierz miasto</option>
                </select>
              </div>

              <div class="select-row">
                <label for="locker-select" class="label-create-package">Wybierz automat docelowy:</label>
                <select id="locker-select" name="locker-select" required>
                  <option value="" disabled selected>Najpierw wybierz miasto</option>
                </select>
              </div>

            </div>

              <div class="form-group--3 form-group">
                <div class="package-dims-input">

                  <div class="dims-prop dims-prop-width">
                    <label for="package-width" class="label-create-package">Szerokość (cm):</label>
                    <input type="number" id="package-width" name="package-width" min="1" step="0.1" required />
                  </div>

                  <div class="dims-prop dims-prop-height">
                    <label for="package-height" class="label-create-package">Wysokość (cm):</label>
                    <input type="number" id="package-height" name="package-height" min="1" step="0.1" required />
                  </div>

                  <div class="dims-prop dims-prop-depth">
                    <label for="package-depth" class="label-create-package">Głębokość (cm):</label>
                    <input type="number" id="package-depth" name="package-depth" min="1" step="0.1" required />
                  </div>
                </div>

                <p class="view-create-package__hint" id="package-size-hint"></p>

                <select id="package-size" name="package-size" required>
                  <option value="" disabled selected>Wybierz rozmiar</option>
                  <option value="small">Mała</option>
                  <option value="medium">Średnia</option>
                  <option value="large">Duża</option>
                </select>
               <button type="submit" class="header__button" id="create-package-btn">Nadaj paczkę</button>
              </div>
        
          </form>
        </section>

        <!-- ========================= -->
        <!-- WIDOK: KURIER             -->
        <!-- ========================= -->
        <section class="view hidden view-kurier" id="view-kurier" data-view data-roles="KURIER">
   

          <section class="view__content">
            <section class="paczki__list" id="kurier-paczki-list">
            
            </section>

            <section class="paczka-details hidden" id="kurier-paczka-details">
              <div class="view-kurier__paczka-details__box hidden" id="kurier-paczka-details_box">
                <div class="view-kurier__paczka-details__box-general-info view-kurier__paczka-details__box-section">
                 
                  <p class="view-kurier__paczka-details__row">
                    <span class="span-label">Status</span>
                    <span class="span-value" id="kurier-status-value"></span>
                  </p>

                  <p class="view-kurier__paczka-details__row">
                    <span class="span-label">Wymiary</span>
                    <span class="span-value" id="kurier-dims-value"></span>
                  </p>

                  <p class="view-kurier__paczka-details__row">
                    <span class="span-label">Nadawca</span>
                    <span class="span-value" id="kurier-sender-value"></span>
                  </p>

                  <p class="view-kurier__paczka-details__row">
                    <span class="span-label">Odbiorca</span>
                    <span class="span-value" id="kurier-receiver-value"></span>
                  </p>

                </div>

                <div class="view-kurier__paczka-details__box-locker-info view-kurier__paczka-details__box-section">
                  <p class="view-kurier__paczka-details__row">
                    <span class="span-label">Aktualny automat</span>
                    <span class="span-value" id="kurier-aktualny-automat-value"></span>
                  </p>

                  <p class="view-kurier__paczka-details__row">
                    <span class="span-label">Docelowy automat</span>
                    <span class="span-value" id="kurier-docelowy-automat-value"></span>
                  </p>
                </div>
                      <div class="view-kurier__paczka-details__box-actions view-kurier__paczka-details__box-section" id="kurier-actions">

                  <div class="view-kurier__paczka-details__row hidden" id="kurier-skrytka-row">
                    <span class="span-label">Skrytka docelowa</span>
                    <span class="span-value" id="kurier-skrytka-value"></span>
                  </div>

                  <p class="view-kurier__paczka-details__hint" id="kurier-hint"></p>

                  <div class="view-kurier__paczka-details__buttons">
                    <button class="header__button" id="kurier-odebrana-btn" type="button">
                      Rozpocznij transport
                    </button>

                    <button class="header__button" id="kurier-dostarcz-btn" type="button">
                      Umieść w automacie
                    </button>
                  </div>
                </div>
                <div class="view-kurier__paczka-details__box-events view-kurier__paczka-details__box-section" id="kurier-paczka-zdarzenia"></div>

          
              </div>

              <div class="locker-display hidden" id="kurier-locker-display">
                <h2 class="locker-display__locker-name" id="kurier-locker-name"></h2>

                <div class="locker-display__grid"></div>


              </div>


            </section>
          </section>
        </section>


        <!-- ========================= -->
        <!-- WIDOK 5: OPERATOR/ADMIN   -->
        <!-- ========================= -->
        <section class="view hidden" id="view-operator" data-view data-roles="ADMIN,OPERATOR">
          <section class="view__header">
            <h2 class="view__title"></h2>
          </section>

          <section class="view__content view__content--operator">
            <section class="operator-panel" id="operator-panel">
              <section class="operator-panel__header">
                <h3 class="operator-panel__title">Paczki do zatwierdzenia</h3>

                <div class="operator-panel__actions">
                  <input
                    class="operator-panel__search"
                    id="operator-search"
                    type="text"
                    placeholder="Szukaj: tracking / nadawca / odbiorca"
                    autocomplete="off"
                  />

                  <button class="operator-panel__refresh" id="operator-refresh-btn" type="button">
                    Odśwież
                  </button>
                </div>
              </section>

              <section class="operator-panel__grid">
                <section class="operator-panel__list">
                  <p class="operator-panel__message" id="operator-pending-message"></p>

                  <div class="operator-panel__list-buttons" id="operator-pending-list"></div>
                </section>

                <section class="operator-panel__details hidden" id="operator-details-box">
                  <section class="operator-panel__details-header">
                    <h4 class="operator-panel__details-title">Szczegóły paczki</h4>

                    <div class="operator-panel__details-actions">
                      <button class="operator-panel__approve" id="operator-approve-btn" type="button">
                        Zatwierdź
                      </button>
                    </div>
                  </section>

                  <section class="operator-panel__details-body">
                    <div class="operator-panel__row">
                      <span class="operator-panel__label">Status:</span>
                      <span class="operator-panel__value" id="operator-status-value"></span>
                    </div>

                    <div class="operator-panel__row">
                      <span class="operator-panel__label">Numer tracking:</span>
                      <span class="operator-panel__value" id="operator-tracking-value"></span>
                    </div>

                    <div class="operator-panel__row">
                      <span class="operator-panel__label">Nadawca:</span>
                      <span class="operator-panel__value" id="operator-sender-value"></span>
                    </div>

                    <div class="operator-panel__row">
                      <span class="operator-panel__label">Odbiorca:</span>
                      <span class="operator-panel__value" id="operator-receiver-value"></span>
                    </div>

                    <div class="operator-panel__row">
                      <span class="operator-panel__label">Data nadania:</span>
                      <span class="operator-panel__value" id="operator-created-value"></span>
                    </div>

                    <div class="operator-panel__row operator-panel__row--dims">
                      <span class="operator-panel__label">Wymiary:</span>
                      <span class="operator-panel__value" id="operator-dims-value"></span>
                    </div>

                    <div class="operator-panel__row">
                      <span class="operator-panel__label">Docelowy automat:</span>
                      <span class="operator-panel__value" id="operator-locker-value"></span>
                    </div>

                    <p class="operator-panel__hint" id="operator-hint"></p>
                  </section>
                </section>
              </section>
            </section>
          </section>
        </section>

      </main>
    </div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
