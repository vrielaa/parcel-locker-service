<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css?family=Josefin+Sans:300,400,400i|Nunito:300,300i"
      rel="stylesheet"
    />

    <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
      <symbol id="icon-go-back" viewBox="0 0 128 128">
        <path d="M78.1 0v6.2c22.4 0 40.5 18.2 40.5 40.6s-18.1 40.6-40.5 40.6H17.9l27.9-28-4.5-4.5L5.5 90.8l36 36.2 4.5-4.5-28.8-28.9h60.9c25.8 0 46.7-21 46.7-46.8S103.9 0 78.1 0z"/>
      </symbol>
    </svg>
    <link rel="icon" href="./favicon.ico">
    <link rel="stylesheet" href="sass/main.scss" />
    <link rel="shortcut icon" type="image/png" href="img/parcel.png" />
    <title>Parcel Locker Service - Login</title>
  </head>
  <body>
    <div class="container container--login">
 

        <section class="message">
            <p class="db-message" id="db-message"></p>
        </section>
        <h1 class="heading--1 login__heading--1">
          System Obsługi Automatów Paczkowych
        </h1>



      <main class="main main--login">

        <section class="login-entry">
          <section class="login-section">

            <div class="login-header">
              <h2 class="heading--2 login__heading--2">Logowanie</h2>
              <p class="subheading login__subheading">Zaloguj się jako klient lub operator</p>
            </div>

            <form id="login-form" class="login-section__form" novalidate>
              <div class="login-section__form-row">
                <label class="login-section__form-row--label" for="email">Email</label>
                <input
                  class="login-section__form-row--input"
                  id="email"
                  name="email"
                  type="email"
                  required
                  autocomplete="username"
                />
              </div>

              <div class="login-section__form-row">
                <label class="login-section__form-row--label" for="password">Hasło</label>
                <input
                  class="login-section__form-row--input"
                  id="password"
                  name="password"
                  type="password"
                  required
                  autocomplete="current-password"
                />
              </div>
              <p class="login-section__login-error" id="login-error"></p>
              <div class="login-section__form-row login-section__form-row--actions">
                <button class="login-section__form-row--button" type="submit" id="login-button">Zaloguj</button>
              </div>
              <p id="register-link-paragraph">Nie masz konta? <a href="register.html" id="register-link-href">Zarejestruj się</a></p>

                
              </p>
            </form>
            </section>
        </section>
        <section class="login-svg">
          <img src="svg/parcel-locker.svg" alt="Login Illustration" />
        </section>
      </main>
    </div>

    <script type="module" src="src/login.js"></script>
  </body>
</html>
