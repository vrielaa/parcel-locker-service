<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css?family=Josefin+Sans:300,400,400i|Nunito:300,300i"
      rel="stylesheet"
    />
    
    <link rel="stylesheet" href="sass/main.scss" />
    <link rel="shortcut icon" type="image/png" href="img/parcel.png" />

    <title>Parcel Locker Service</title>
  </head>
 <body>
    <div class="container">
        <header class="header">
                <button class="header__button" id="check-db-button">Sprawdz połączenie z bazą</button>
                <button class="header__button" id="clear-db-button">Wyczyść baze danych</button>
                <button class="header__button" id="init-db-button">Wczytaj baze danych</button>
        </header>
        <section class="sidebar">
            <nav class="sidebar__nav">
                <button class="sidebar__button" id="get-automaty">Lista automatów</button>
            </nav>
        </section>
        <main class="main">
            <section class="db-messages">
                <pre id="db-result" class="db-result"></pre>
            </section>
        </main>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
