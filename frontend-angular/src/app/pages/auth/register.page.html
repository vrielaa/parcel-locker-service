<main class="grid min-h-screen place-items-center bg-background px-4 py-10">
  <section class="mx-auto grid w-full max-w-2xl gap-5 rounded-2xl border border-line bg-surface p-7 shadow-card">
    <div>
      <p class="mb-2 text-xs font-bold uppercase text-muted">Nowe konto klienta</p>
      <h1 class="m-0 text-3xl leading-tight">Rejestracja</h1>
    </div>

    <form class="grid gap-4" (submit)="submit($event)">
      <div class="grid gap-4 md:grid-cols-2">
        <label class="app-label">Imię<input class="app-input" [formField]="registerForm.firstName"></label>
        <label class="app-label">Nazwisko<input class="app-input" [formField]="registerForm.lastName"></label>
      </div>

      <div class="grid gap-4 md:grid-cols-2">
        <label class="app-label">Email<input class="app-input" type="email" [formField]="registerForm.email"></label>
        <label class="app-label">Telefon<input class="app-input" [formField]="registerForm.phone"></label>
      </div>

      <div class="grid gap-4 md:grid-cols-2">
        <label class="app-label">Hasło<input class="app-input" type="password" [formField]="registerForm.password"></label>
        <label class="app-label">Powtórz hasło<input class="app-input" type="password" [formField]="registerForm.password2"></label>
      </div>

      @if (message()) {
        <p class="m-0 rounded-lg border border-danger/20 bg-danger/10 px-3 py-2 text-sm text-danger">{{ message() }}</p>
      }

      <button class="app-button" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Tworzenie konta...' : 'Utwórz konto' }}
      </button>
    </form>

    <p class="m-0 text-sm text-muted">
      Masz już konto?
      <a class="app-link" routerLink="/login">Wróć do logowania</a>
    </p>
  </section>
</main>
