<main class="grid min-h-screen place-items-center bg-background px-4 py-10">
  <section class="auth-card">
    <div>
      <p class="mb-2 text-xs font-bold uppercase text-muted">Bezpieczeństwo</p>
      <h1 class="m-0 text-3xl leading-tight">Zmień hasło</h1>
    </div>

    <form class="grid gap-4" (submit)="submit($event)">
      <label class="app-label">Aktualne hasło<input class="app-input" type="password" [formField]="changePasswordForm.currentPassword"></label>
      <label class="app-label">Nowe hasło<input class="app-input" type="password" [formField]="changePasswordForm.newPassword"></label>
      <label class="app-label">Powtórz nowe hasło<input class="app-input" type="password" [formField]="changePasswordForm.newPassword2"></label>

      @if (message()) {
        <p class="m-0 rounded-lg border border-danger/20 bg-danger/10 px-3 py-2 text-sm text-danger">{{ message() }}</p>
      }

      <button class="app-button" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Zapisywanie...' : 'Zmień hasło' }}
      </button>
    </form>
  </section>
</main>
