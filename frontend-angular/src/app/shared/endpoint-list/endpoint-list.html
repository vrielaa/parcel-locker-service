@if (hasEndpoints()) {
  <ul class="mt-4 flex list-none flex-wrap gap-2 p-0">
    @for (endpoint of endpoints(); track endpoint) {
      <li>
        <button
          type="button"
          [class.border-brand]="selectedEndpoint() === endpoint"
          [class.text-brand-strong]="selectedEndpoint() === endpoint"
          class="rounded-lg border border-line bg-background px-2.5 py-2 font-mono text-sm text-muted transition-colors hover:border-brand hover:text-brand-strong"
          (click)="selectEndpoint(endpoint)"
        >
          {{ endpoint }}
        </button>
      </li>
    }
  </ul>
} @else {
  <p class="mt-4 text-muted">No endpoints mapped yet.</p>
}
