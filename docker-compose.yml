services:
  db:
    image: postgres:16-alpine
    container_name: parcel-locker-postgres
    environment:
      POSTGRES_DB: parcel_locker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - parcel-locker-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parcel_locker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  parcel-locker-postgres-data:
